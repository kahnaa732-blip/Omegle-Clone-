# ==============================================================================
# Coturn STUN & TURN Relay Server Configuration for Haven
# RFC 5766 TURN REST API with Ephemeral HMAC-SHA1 Tokens & Bandwidth Protections
# ==============================================================================

# Network & Listening Ports
listening-port=3478
tls-listening-port=5349
alt-listening-port=3479
alt-tls-listening-port=5350

# Listening IP / interfaces (Leave empty to bind to all interfaces 0.0.0.0)
# listening-ip=0.0.0.0
# relay-ip=YOUR_SERVER_PUBLIC_IPV4

# Relay Port Range (Must be opened in firewall: UDP 49152-65535)
min-port=49152
max-port=65535

# RFC 5766 REST API Ephemeral Auth (Used with Node.js HMAC-SHA1 generator)
use-auth-secret
static-auth-secret=haven_turn_secret_key_change_in_production
realm=haven.chat

# Anti-Abuse & Bandwidth Caps
# Caps relay duration to 600s (10 min) to prevent runaway relay bandwidth costs
max-allocate-lifetime=600
stale-nonce=600

# Channel & Allocation Quotas
total-quota=0
user-quota=10

# Security & Anti-Loopback Hardening
fingerprint
lt-cred-mech
no-loopback-peers
no-multicast-peers
no-cli

# Logging
verbose
log-file=/var/log/turnserver/turnserver.log
simple-log
