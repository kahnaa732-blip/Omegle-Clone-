# ==============================================================================
# Strict 24-Hour Privacy Log Rotation Policy (Nginx & Coturn)
# Ensures zero permanent storage of IP-to-Session relationships
# ==============================================================================

/var/log/nginx/omegal_*.log {
    daily
    rotate 1
    missingok
    notifempty
    compress
    delaycompress
    sharedscripts
    postrotate
        [ -f /var/run/nginx.pid ] && kill -USR1 `cat /var/run/nginx.pid`
    endscript
}

/var/log/turnserver/*.log {
    daily
    rotate 1
    missingok
    notifempty
    compress
    sharedscripts
    postrotate
        systemctl reload coturn > /dev/null 2>&1 || true
    endscript
}
