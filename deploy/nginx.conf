# ==============================================================================
# Production Nginx Reverse Proxy Configuration for Omegal
# WebSocket upgrades, Cloudflare proxy trust, and rate-limiting
# ==============================================================================

# Rate limit zone: 15 req/sec per IP burst 30
limit_req_zone $binary_remote_addr zone=match_gate:10m rate=15r/s;

# Upstream Node.js Signaling Cluster
upstream omegal_backend {
    server 127.0.0.1:4000;
    keepalive 64;
}

server {
    listen 80;
    server_name omegal.yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name omegal.yourdomain.com;

    # SSL Configuration (Certbot / Cloudflare Origin CA)
    # ssl_certificate /etc/letsencrypt/live/omegal.yourdomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/omegal.yourdomain.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Privacy Protection: Do NOT log sensitive IP query strings or paths
    access_log /var/log/nginx/omegal_access.log combined buffer=32k flush=5m;
    error_log /var/log/nginx/omegal_error.log warn;

    # Root for static frontend build
    root /var/www/omegal/client/dist;
    index index.html;

    # Frontend Single Page App routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Socket.IO Signaling WebSocket Upgrades
    location /socket.io/ {
        limit_req zone=match_gate burst=30 nodelay;

        proxy_pass http://omegal_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;

        # Cloudflare real IP header support
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebRTC signaling connection timeouts
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # REST API endpoints
    location /api/ {
        limit_req zone=match_gate burst=20 nodelay;
        proxy_pass http://omegal_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
    }
}
